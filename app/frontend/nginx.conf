server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript text/javascript application/xml image/svg+xml;

    # DNS interno do Docker: resolve "backend" em tempo de requisição, para o nginx
    # subir mesmo se o backend ainda não estiver pronto (a UI mostra "API indisponível").
    resolver 127.0.0.11 valid=10s ipv6=off;

    # API -> backend FastAPI (mantém o prefixo /api: proxy_pass sem URI repassa o caminho original)
    location /api/ {
        set $backend_upstream http://backend:8000;
        proxy_pass $backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header Connection "";
        proxy_connect_timeout 10s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # Assets com hash no nome: cache longo
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SPA: qualquer rota cai no index.html
    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache";
    }
}
